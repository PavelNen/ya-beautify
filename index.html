<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ya Beautify</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #202124;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 48px;
      user-select: none;
      white-space: nowrap;
    }
    .logo-ya { color: #FC3F1D; }

    h1 {
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      max-width: 560px;
      margin-bottom: 36px;
      letter-spacing: -0.5px;
    }

    .btn {
      display: inline-block;
      background: #FC3F1D;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .btn:hover { background: #e03618; }

    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #aaa;
    }
    footer a { color: #aaa; text-decoration: none; }
    footer a:hover { color: #555; }
  </style>
</head>
<body>

  <div class="logo"><span class="logo-ya">Я</span><span>ндекс Beautify</span></div>

  <h1>Яндекс перестал быть поиском.<br>Мы это исправили.</h1>

  <a class="btn" href="https://chromewebstore.google.com/detail/fikhpbeegfgibjodccoaalienbakhnkn?utm_source=item-share-cb" target="_blank">
    Установить для Chrome
  </a>

  <footer>
    <span>Не аффилировано с Яндексом</span>
    <a href="privacy.html">Конфиденциальность</a>
  </footer>

</body>
</html>
